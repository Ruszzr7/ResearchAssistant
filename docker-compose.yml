services:
  mysql:
    image: mysql:8.0.39
    container_name: research-assistant-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-research_assistant}
      MYSQL_USER: ${MYSQL_USER:-research}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-research-local-password}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root-local-password}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
    networks: [research]

  backend:
    build:
      context: ./backend
    container_name: research-assistant-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-research_assistant}?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-research}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD:-research-local-password}
      RA_MASTER_KEY: ${RA_MASTER_KEY:?RA_MASTER_KEY must be set}
      RA_CORS_ALLOWED_ORIGINS: ${RA_CORS_ALLOWED_ORIGINS:-http://localhost:8088}
      APP_STORAGE_PDF_DIR: /data/papers
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
    volumes:
      - papers-data:/data/papers
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/actuator/health | grep -q 'UP'"]
      interval: 10s
      timeout: 5s
      retries: 30
    networks: [research]

  frontend:
    build:
      context: ./frontend
    container_name: research-assistant-frontend
    ports:
      - "${FRONTEND_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks: [research]

volumes:
  mysql-data:
    name: research-assistant-mysql-data
  papers-data:
    name: research-assistant-papers-data
networks:
  research:
