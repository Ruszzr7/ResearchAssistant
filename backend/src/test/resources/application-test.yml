spring:
  flyway:
    enabled: false
  datasource:
    url: jdbc:h2:mem:research_assistant_test;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;NON_KEYWORDS=VALUE,YEAR
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:test-schema.sql

app:
  encryption:
    fail-closed: false
  # 所有 Spring 测试的派生文件都落到临时目录，避免误写正式 data/ 目录。
  storage:
    pdf-dir: ${java.io.tmpdir}/research-assistant-test/papers
    figures-dir: ${java.io.tmpdir}/research-assistant-test/figures
    agent-attachments-dir: ${java.io.tmpdir}/research-assistant-test/agent-attachments
  rag:
    index-retention: 7d
  async:
    mark-orphaned-on-startup: false
    max-inflight: 4
    max-queue-depth: 100
    dispatch-enabled: false
