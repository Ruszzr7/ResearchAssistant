server:
  port: 8080

spring:
  application:
    name: research-assistant

  mvc:
    async:
      request-timeout: 180000

  # MySQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/research_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized

# Application
app:
  async:
    # 生产环境启动时将上次未完成任务标记为 FAILED；测试环境关闭，避免触碰测试数据。
    mark-orphaned-on-startup: true
    schema-init-enabled: true
    pending-user-ttl: ${ASYNC_PENDING_USER_TTL:24h}
    execution-timeout: ${ASYNC_TASK_TIMEOUT:30m}
  storage:
    pdf-dir: ${APP_STORAGE_PDF_DIR:./data/papers}
  encryption:
    # 敏感设置（如 api_key）加密主密钥；优先读取环境变量 RA_MASTER_KEY。
    # 未配置时 API Key 会明文保存，仅适合本地临时开发。
    master-key: ${RA_MASTER_KEY:}
  ai-quality:
    retention-days: ${AI_QUALITY_RETENTION_DAYS:180}
    retention-cron: ${AI_QUALITY_RETENTION_CRON:0 30 3 * * *}
