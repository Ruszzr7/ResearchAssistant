server:
  port: 8080
  address: ${SERVER_ADDRESS:127.0.0.1}

spring:
  application:
    name: research-assistant

  mvc:
    async:
      request-timeout: 180000

  # MySQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/research_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    locations: classpath:db/migration
    validate-on-migrate: true
    baseline-on-migrate: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:false}
    baseline-version: ${SPRING_FLYWAY_BASELINE_VERSION:12.1}

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    # Production-safe default; set MYBATIS_LOG_IMPL to Slf4jImpl only for local debugging.
    log-impl: ${MYBATIS_LOG_IMPL:org.apache.ibatis.logging.nologging.NoLoggingImpl}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: never
      probes:
        enabled: true

# Application
app:
  agent:
    skills-dir: ${APP_AGENT_SKILLS_DIR:../skills}
  paper-memory:
    # Only used to split an individual oversized source block for transport;
    # paper understanding itself remains one whole-paper model call.
    source-max-chars: ${PAPER_MEMORY_SOURCE_MAX_CHARS:36000}
  ai:
    # Long-paper understanding uses a separate request deadline from chat.
    paper-request-timeout-seconds: ${APP_AI_PAPER_REQUEST_TIMEOUT_SECONDS:150}
  rag:
    index-retention: ${RAG_INDEX_RETENTION:7d}
    index-cleanup-cron: ${RAG_INDEX_CLEANUP_CRON:0 45 3 * * *}
  async:
    # 生产环境启动时将上次未完成任务标记为 FAILED；测试环境关闭，避免触碰测试数据。
    mark-orphaned-on-startup: true
    pending-user-ttl: ${ASYNC_PENDING_USER_TTL:24h}
    execution-timeout: ${ASYNC_TASK_TIMEOUT:30m}
    dispatch-batch-size: ${ASYNC_DISPATCH_BATCH_SIZE:10}
    lease-duration: ${ASYNC_TASK_LEASE:5m}
    retry-base-delay: ${ASYNC_RETRY_BASE_DELAY:5s}
    max-attempts: ${ASYNC_MAX_ATTEMPTS:3}
    max-inflight: ${ASYNC_MAX_INFLIGHT:20}
    max-queue-depth: ${ASYNC_MAX_QUEUE_DEPTH:500}
    dispatch-enabled: ${ASYNC_DISPATCH_ENABLED:true}
  storage:
    pdf-dir: ${APP_STORAGE_PDF_DIR:../data/papers}
    figures-dir: ${APP_STORAGE_FIGURES_DIR:../data/figures}
    agent-attachments-dir: ${APP_STORAGE_AGENT_ATTACHMENTS_DIR:../data/agent-attachments}
  encryption:
    # 敏感设置（如 api_key）加密主密钥；优先读取环境变量 RA_MASTER_KEY。
    # 未配置时 API Key 会明文保存，仅适合本地临时开发。
    master-key: ${RA_MASTER_KEY:}
    # Set RA_ENCRYPTION_FAIL_CLOSED=true in production. The prod profile defaults to true.
    fail-closed: ${RA_ENCRYPTION_FAIL_CLOSED:false}
  http:
    cors:
      allowed-origins: ${RA_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174,http://[::1]:5173,http://[::1]:5174}
      allow-credentials: ${RA_CORS_ALLOW_CREDENTIALS:false}
  external:
    timeout: ${RA_EXTERNAL_TIMEOUT:30s}
    max-attempts: ${RA_EXTERNAL_MAX_ATTEMPTS:2}
    retry-backoff: ${RA_EXTERNAL_RETRY_BACKOFF:250ms}
    max-concurrency: ${RA_EXTERNAL_MAX_CONCURRENCY:8}
    permit-wait: ${RA_EXTERNAL_PERMIT_WAIT:25ms}
  translation:
    provider: ${RA_TRANSLATION_PROVIDER:deepl}
    glossary-version: ${RA_TRANSLATION_GLOSSARY_VERSION:v1}
    cache-maximum-size: ${RA_TRANSLATION_CACHE_MAX_SIZE:1000}
    cache-expire-after-access: ${RA_TRANSLATION_CACHE_TTL:24h}
  ai-quality:
    retention-days: ${AI_QUALITY_RETENTION_DAYS:180}
    retention-cron: ${AI_QUALITY_RETENTION_CRON:0 30 3 * * *}

---
spring:
  config:
    activate:
      on-profile: prod

app:
  encryption:
    fail-closed: ${RA_ENCRYPTION_FAIL_CLOSED:true}
