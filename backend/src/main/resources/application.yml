server:
  port: 8080

spring:
  application:
    name: research-assistant

  mvc:
    async:
      request-timeout: 180000

  # MySQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/research_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Application
app:
  storage:
    pdf-dir: ${APP_STORAGE_PDF_DIR:./data/papers}
  encryption:
    # 敏感设置（如 api_key）加密主密钥；优先读取环境变量 RA_MASTER_KEY
    master-key: ${RA_MASTER_KEY:}
