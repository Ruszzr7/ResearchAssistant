server:
  port: 8080

spring:
  application:
    name: research-assistant

  mvc:
    async:
      request-timeout: 180000

  # MySQL
  datasource:
    url: jdbc:mysql://localhost:3306/research_assistant?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: root
    password:
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

# MyBatis Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Application
app:
  storage:
    pdf-dir: ./data/papers
