services:
  qdrant:
    image: qdrant/qdrant:v1.13.0
    container_name: research-assistant-qdrant
    ports:
      - "6333:6333"   # REST API / Dashboard
      - "6334:6334"   # gRPC (Java client)
    volumes:
      - ./data/qdrant:/qdrant/storage
    environment:
      # 如需启用 API Key，取消下行注释并设置复杂密码
      # QDRANT__SERVICE__API_KEY: "your-secret-api-key"
    restart: unless-stopped
