          - paragraph [ref=f9e247]: This paper presents the first comprehensive tutorial and survey on rate-splitting multiple access (RSMA), reviewing its architecture, taxonomy, and applications while benchmarking it against existing multiple access schemes. It establishes RSMA as a unified physical-layer non-orthogonal transmission framework that bridges SDMA and NOMA by splitting user messages into common and private parts and partially decoding interference. It also identifies standardization and research challenges for RSMA in beyond-5G/6G wireless networks.
