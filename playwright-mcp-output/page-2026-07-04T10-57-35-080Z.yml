            - text: "# 多篇论文横向对比分析报告 ## 1. 共同维度与核心差异识别 本次需要对比的两篇论文分别属于**计算机视觉（CV）骨干网络**与**无线通信物理层/多址接入**两个截然不同的领域： | 识别维度 | 论文 17：PyramidTNT | 论文 10：短块长 CSIT 下的 RSMA | |---|---|---| | 学科领域 | 计算机视觉 / 深度学习 | 无线通信 / 信息论与信号处理 | | 核心目标 | 在视觉任务中实现**精度–计算量**的更优折中 | 在 URLLC 高移动场景中实现**速率–时延–可靠性**的更优折中 | | 研究范式 | 实验驱动：设计网络架构并在公共数据集上验证 | 理论驱动：建立信道模型并推导闭式性能表达式 | | 数据/场景 | 真实的图像数据（ImageNet、COCO） | 数学化的随机信道模型（Jakes/Gauss-Markov） | | 比较对象 | TNT、Swin、PVT、DeiT 等视觉骨干 | NOMA、SDMA 等多址接入方案 | **最具分析价值的对比角度**并不在于“谁更准确/更快”，而在于： 1. **问题定义上的同构性**：二者都在“受限资源下提升系统性能”这一大框架下工作，但对“资源”与“性能”的具体含义完全不同。 2. **方法论上的互补性**：一篇是数据驱动的架构工程，一篇是模型驱动的解析推导。 3. **评估体系的不可通约性**：公共基准 vs. 信道仿真，准确率/FLOPs vs. 速率/块长/BLER。 --- ## 2. 横向对比表 ### 表 1：研究问题、方法与实验设置对比 | 维度 | 论文 17：PyramidTNT | 论文 10：短块长 CSIT 的 RSMA | |---|---|---| | **研究问题** | 如何改进 Transformer-in-Transformer（TNT），使其具备金字塔多尺度特征、更低计算量，并提升视觉骨干在分类与检测任务上的性能 | 如何在发射端非完美 CSIT 下，分析 FBL-RSMA 在高移动 URLLC 场景中的遍历和速率，并降低满足 BLER 要求所需的块长 | | **基础框架** | TNT、Swin Transformer、PVT 等层次化视觉 Transformer | RSMA、NOMA、SDMA、MISO 广播信道 | | **核心创新** | 1. 用 **3×3 卷积 stem** 替代 patchify；"
            - text: 2. 引入 **四阶段金字塔结构**，逐步下采样；
            - text: 3. 采用 **Linear Spatial Reduction Attention（LSRA）** 降低早期计算 | 1. 在非完美 CSIT 下推导公共/私有流 SINR 的统计特性；
            - text: 2. 给出 FBL RSMA 遍历和速率的**闭式表达式**；
            - text: "3. 将 FBL 速率近似与 Jakes/Gauss-Markov 信道模型结合 | | **方法类型** | AI/CV \\| 实验型（EXPERIMENTAL） | 通信 \\| 理论型（THEORETICAL） | | **主要任务** | ImageNet-1K 图像分类、COCO 目标检测 | 多用户 MISO 下行链路速率分析、块长与 BLER 优化 | | **数据集/环境** | **真实公共数据集**：ImageNet-1K、COCO | **无真实数据集**；基于 Jakes 相关/高斯–马尔可夫模型的数值仿真 | | **评估指标** | top-1 准确率、COCO mAP、FLOPs、参数量 | 遍历和速率、块长、BLER（$10^{-5}\\sim 10^{-7}$）、SINR 的 CDF | | **关键超参数** | 模型尺寸（Ti/S/M/B）、分辨率、stage 下采样率 | 发射天线数 $N_t$、车辆数 $K$、车速、块长、BLER、CSIT 误差相关参数 | ### 表 2：性能结果、优势与局限对比 | 维度 | 论文 17：PyramidTNT | 论文 10：短块长 CSIT 的 RSMA | |---|---|---| | **主要性能结果** | PyramidTNT-S：ImageNet-1K **82.0% top-1**，**3.3B FLOPs**，32.0M 参数；优于 TNT-S（81.5%, 5.2B）和 Swin-T（81.3%, 4.5B）。COCO 检测 **42.0 mAP**。PyramidTNT-B 达 84.1%，16.0B FLOPs。 | 在满足 $10^{-5}\\sim 10^{-7}$ BLER 要求下，FBL-RSMA 相比 FBL-NOMA 与 SDMA **显著减少块长**（即时延）。提供了遍历和速率的闭式表达式。 | | **直接性能比较** | 可与同领域模型在相同数据集上直接比较 | 无法与 CV 模型直接比较；仅能在相同信道假设下与 NOMA/SDMA 进行仿真对比 | | **核心优势** | 1. 在公开视觉基准上取得了领先的精度–效率折中；"
            - text: 2. 金字塔结构天然适合下游检测/分割任务；
            - text: 3. 卷积 stem 提升训练稳定性与局部特征提取 | 1. 提供了**解析闭式**，便于洞察系统参数影响；
