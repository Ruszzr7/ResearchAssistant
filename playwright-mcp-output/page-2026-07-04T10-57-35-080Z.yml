            - text: 3. 信道模型为空间不相关瑞利平坦衰落，未考虑多径、相关衰落；
            - text: "4. 文本截断，完整实验设置与更多对比细节不足 | --- ## 3. 深度分析：差异背后的原因 ### 3.1 学科目标决定方法论取向 - **计算机视觉**的核心挑战是**从高维、非结构化的图像数据中提取可泛化的视觉表征**。由于图像分布复杂、难以用闭式描述，因此 Transformer、CNN 等架构的进步高度依赖**大规模数据实验**。PyramidTNT 的卷积 stem、金字塔下采样、LSRA 等设计本质上是通过工程手段压缩“空间冗余”与“注意力冗余”，再用 ImageNet/COCO 验证其有效性。 - **无线通信**的核心挑战是**在严格时延、可靠性约束下实现多用户信息传输**。其信道模型、调制编码、干扰结构可以用概率论与随机矩阵近似刻画，因此研究者更倾向于**推导闭式速率/中断概率**，从而获得对天线数、车速、块长、BLER 等参数的显式洞察。 简言之：CV 领域“数据太复杂，必须靠实验”；通信领域“模型可近似，追求解析保证”。 ### 3.2 “性能–资源”折中的内涵不同 两篇论文都在优化某种帕累托前沿，但坐标轴不同： | 论文 | 横轴（资源/成本） | 纵轴（性能/收益） | |---|---|---| | PyramidTNT | FLOPs、参数量、推理延迟 | 准确率、mAP | | RSMA-FBL | 块长（传输时延）、发射天线数、功率 | 遍历和速率、BLER 可靠性 | 这也解释了为什么 PyramidTNT 强调“用更少的计算达到更高精度”，而 RSMA 论文强调“在满足同样 BLER 时用更短块长传输”。二者在不同资源约束下追求最优。 ### 3.3 多尺度/多流处理的对偶性 尽管应用领域不同，两篇论文在“**将信息分成多个粒度/流**”这一点上有趣地相似： - **PyramidTNT**：TNT 本身将图像特征划分为“句子级”（sentence）与“词级”（word）表示；PyramidTNT 进一步通过四阶段金字塔在不同空间分辨率上构建层次化特征。 - **RSMA**：将每个用户消息划分为“公共部分”与“私有部分”，公共流由所有用户解码，私有流通过 SIC 逐个解码。 这种“**分层/分流**”策略都是试图在复杂系统中实现更灵活的资源分配：视觉中是多尺度感知，通信中是多用户干扰管理。 ### 3.4 评估体系不可通约 - **PyramidTNT** 的价值由公共基准上的排名决定，实验可复现性强，但结果受数据增强、训练预算、超参数影响较大。 - **RSMA-FBL** 的价值由数学推导的正确性与仿真假设的合理性决定。其局限在于：一旦信道模型偏离实际（如多径、相关衰落、非平稳高移动场景），闭式结论可能失真。 --- ## 4. 改进方向与潜在交叉启示 ### 4.1 论文 17（PyramidTNT）的改进方向 1. **组件级消融**：明确量化 conv stem、金字塔 stage、LSRA 各自对精度与效率的贡献。 2. **轻量化与部署优化**：针对 PyramidTNT-B 参数量过大的问题，可引入 NAS、知识蒸馏、量化或设计更窄的通道配置。 3. **扩展下游任务**：在语义分割、实例分割、鲁棒性基准、迁移学习等任务上验证通用性。 4. **动态注意力**：LSRA 是固定空间下采样，可探索基于内容或输入分辨率的自适应 token 减少策略。 ### 4.2 论文 10（RSMA-FBL）的改进方向 1. **更优预编码与功率分配**：将私有流的 ZF+等功率替换为 WMMSE、BD 或基于统计 CSIT 的优化预编码。 2. **多层/多簇 RSMA**：从一层 RSMA 扩展到"
