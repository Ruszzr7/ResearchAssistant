            - text: 3. 针对高移动 URLLC 的严苛可靠性要求 | | **主要局限** | 1. 缺少对各组件（conv stem、金字塔、LSRA）的单独消融分析；
            - text: 2. PyramidTNT-B 参数/计算量巨大（157M / 16.0B），部署受限；
            - text: 3. 仅评估分类与检测，未涉及分割、鲁棒性等任务 | 1. 仅考虑**一层 RSMA**，接收机复杂度受限；
