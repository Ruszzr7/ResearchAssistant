            - generic [ref=f6e496]: AI · 核心贡献
            - paragraph [ref=f6e497]: This paper studies downlink RSMA with finite-blocklength (FBL) transmissions for high-mobility autonomous driving; it derives a closed-form lower bound for the ergodic sum-rate that explicitly includes vehicle velocities, positions, per-stream power allocation, blocklengths, and BLERs. To improve the sum-rate while satisfying QoS rate constraints, it proposes a low-complexity joint optimization of the global common/private power split, private power distribution, and common-rate allocation. Simulations show the proposed scheme outperforms uniform-power RSMA and SDMA in ergodic rate, latency, and BLER, and it also improves fairness for users with poor channels.
          - generic [ref=f6e498]:
            - generic [ref=f6e499]: AI · 方法概述
            - paragraph [ref=f6e500]: "The work builds an RSMA-FBL downlink system model under high-mobility/outdated CSIT, derives a closed-form lower bound on the ergodic sum-rate, and then develops a gradient-descent-guided joint optimization: first adjust the global power splitting coefficient using its sum-rate solution; if the common stream is active, optimize private power distribution and adjust the common-rate splitting to meet minimum-rate constraints; if inactive, use sequential quadratic programming (SQP) for private power allocation. Low-complexity linear precoders such as ZF and MRT are assumed."
