          - generic [ref=e617]: AI · 核心贡献
          - paragraph [ref=e618]: PyramidTNT improves the original Transformer-in-Transformer (TNT) by introducing a pyramid architecture and a convolutional stem, producing hierarchical multi-scale visual representations. PyramidTNT-S achieves 82.0% top-1 accuracy on ImageNet-1K with only 3.3B FLOPs, outperforming the original TNT-S and Swin-T. The work also demonstrates strong results on COCO object detection, providing a better accuracy-efficiency trade-off.
        - generic [ref=e619]:
          - generic [ref=e620]: AI · 方法概述
          - paragraph [ref=e621]: "The method builds on the TNT framework and introduces two main designs: (1) a convolutional stem using stacked 3×3 convolutions to replace the patchify stem for more stable training and better local feature extraction, and (2) a four-stage pyramid architecture that progressively reduces spatial resolution of visual words/sentences (e.g., H/4×W/4 to H/16×W/16) using strided convolutions and patch merging. Additional components include relative position encoding and Linear Spatial Reduction Attention (LSRA) to reduce computational cost in early stages."
