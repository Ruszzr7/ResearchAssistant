ramidArchitecture）**-将原始TNT的恒定分辨率token序列改为四个阶段的分层结构，逐阶段降低空间分辨率，构建多尺度视觉表示，同时降低计算量。2.**引入卷积stem（ConvolutionalStem）**-使用多层3×3卷积替代原始的patchify线性投影，提升优化稳定性与性能。3.**融合多种VisionTransformer训练/结构技巧**-包括相对位置编码（RelativePositionEncoding）、线性空间降维注意力（LSRA）等。4.**提出PyramidTNT模型族**-包含Ti、S、M、B四种规格，覆盖从移动端到高精度的计算范围。---##3.方法概述###3.1模型/架构：PyramidTNT|组件|说明||------|------||**卷积Stem**|输入图像经过若干3×3卷积，生成视觉词（visualwords）和视觉句（visualsentences）的初始表示，替代原始TNT的线性patch投影。||**金字塔多阶段结构**|网络分为4个阶段（Stage1–4），每个阶段通过PatchMerging/下采样降低空间分辨率，逐步从细粒度局部特征过渡到高级语义特征。||**TNTBlock**|每个阶段堆叠若干TNT块：内部Transformer对视觉词（局部sub-patch）建模；外部Transformer对视觉句（patch级）建模，同时捕捉局部细节与全局关系。||**LSRA**|在前两个阶段使用LinearSpatialReductionAttention，降低长序列自注意力的计算开销。||**相对位置编码**|加入自注意力的相对位置偏置，帮助建模token之间的空间关系。||**分类头**|最后一个阶段的视觉句经全局平均池化（GAP）后接全连接层输出分类结果。|###3.2模型变体根据提供的Table1，主要模型规格如下：|模型|输入分辨率|参数量(M)|FLOPs(B)||------|-----------|------------|-----------||PyramidTNT-Ti|192×192|10.6|0.6||PyramidTNT-S|256×256|32.0|3.3||PyramidTNT-M|256×256|85.0|8.2||PyramidTNT-B|256×256|157.0|16.0|###3.3训练配置-**优化器**：AdamW-**学习率**：1e-3，余弦衰减-**Epochs**：300-**Batchsize**：1024-**正则化**：Labelsmoothing（0.1）、Droppath、RandAugment、Mixup、Cutmix、RandomErasing-**EMA**：0.99996---##4.使用的数据集与模型###4.1数据集-**ImageNet-1K**：用于图像分类主实验，包含约128万张训练图、5万张验证图，共1000类。-**COCO**：用于目标检测（文中提及PyramidTNT-S在COCO上达到42.0mAP），但提供的文本中未给出详细检测表格。###4.2对比基线模型-**CNN**：ResNet-50/101/152、EfficientNet-B0–B4-**VisionTransformer**：DeiT、T2T-ViT、PVT/PVTv2、SwinTransformer、原始TNT-**MLP-based骨干**：AS-MLP、CycleMLP、Hire-MLP、Wave-MLP---##5.主要发现###5.1ImageNet-1K分类结果|模型|Params(M)|FLOPs(B)|Top-1(%)||------|-----------|-----------|-----------||TNT-S|23.8|5.2|81.5||Swin-T|29|4.5|81.3||**PyramidTNT-S**|32.0|**3.3**|**82.0**||Swin-S|50|8.7|83.0||**PyramidTNT-M**|85.0|8.2|**83.5**||Swin-B|88|15.4|83.3||**PyramidTNT-B**|157.0|16.0|**84.1**|关键结论：1.**PyramidTNT-S在3.3BFLOPs的较低计算量下达到82.0%的Top-1精度**，显著优于同量级的TNT-S（5.2BFLOPs,81.5%）和Swin-T（4.5BFLOPs,81.3%）。2.**PyramidTNT-M/B在更高计算预算下继续领先Swin-S/B**，体现了金字塔结构在大模型上的扩展性。3.极轻量的**PyramidTNT-Ti**在0.6BFLOPs下达到75.2%精度，填补了TNT系列在轻量端的空白。###5.2目标检测-文中提到**PyramidTNT-S在COCO检测上达到42.0mAP**，且计算成本低于其他Transformer和MLP检测模型，但缺少具体配置与完整对比表。---##6.局限性与不足1.**方法创新性有限，属于组合式改进**-金字塔架构、卷积stem、LSRA、相对位置编码等均为已有技术（分别借鉴PVT、ViT-ConvStem、PVTv2、Swin等），文章主要贡献在于将它们系统性地集成到TNT框架中，理论创新较少。2.**缺少充分的消融实验**-提供的文本中没有展示各组件（如金字塔结构、卷积stem、LSRA、相对位置编码）对性能贡献的独立消融结果，难以量化每项改进的具体收益。3.**检测任务细节不足**-仅给出PyramidTNT-S在COCO上的mAP数字（42.0），但未提供检测头、训练设置、与其他模型在相同检测框架下的公平对比。4.**模型参数与效率权衡**-PyramidTNT-S的参数量（32M）略大于Swin-T（29M）；PyramidTNT-B参数量高达157M，对边缘设备部署仍具挑战。-虽然PyramidTNT-S的FLOPs低于Swin-T，但吞吐量（721img/s）也低于Swin-T（755img/s），实际推理效率优势并不显著。5.**实验范围较窄**-主要聚焦ImageNet-1K分类和COCO检测，缺少对语义分割、鲁棒性、迁移学习、模型可解释性等方面的评估。6.**依赖较强的训练配方**-使用RandAugment、Mixup、Cutmix、RandomErasing、EMA等多种数据增强与正则化技巧，基线对比的公平性可能受训练配置影响。---##7.总结**PyramidTNT**是一篇面向视觉Transformer骨干网络的工程改进型论文，通过将**金字塔结构**与**卷积stem**引入TNT，显著提升了TNT在ImageNet-1K分类上的性能与计算效率，并在COCO检测上取得了有竞争力的结果。尽管方法组合性较强、理论创新有限，但它为TNT系列提供了一个更强、更实用的基线，适合作为后续视觉Transformer研究的参考架构。
